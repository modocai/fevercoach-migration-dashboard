name: Validate dashboard
on:
  push:
    branches: [main, dashboard]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate data and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated HTML is up to date
        run: python3 scripts/build_dashboard.py --check
      - name: Check whitespace
        run: git diff --check
