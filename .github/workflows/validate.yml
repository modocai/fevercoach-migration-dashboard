name: Validate dashboard
on:
  push:
    branches: [main, dashboard]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate data and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated HTML is up to date
        run: python3 scripts/build_dashboard.py --check
      - name: Check whitespace
        run: git diff --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install browser test tools outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/dashboard-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/dashboard-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify automatic refresh and desktop behavior with synthetic sources
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/dashboard-browser/node_modules/playwright
        run: node tests/autoupdate-browser.cjs
