name: Publish current migration progress
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Deliberately off until the reviewed activation checklist is complete.
    if: github.ref == 'refs/heads/main' && vars.DASHBOARD_AUTOUPDATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dashboard-source
    permissions:
      contents: read
    outputs:
      degraded: ${{ steps.collect.outputs.degraded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate source code and saved dashboard
        run: |
          python3 -m unittest discover -s tests -q
          python3 scripts/build_dashboard.py --check
      - name: Reject obsolete or duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_dashboard.py --guard
      - name: Collect approved sources and prepare public files
        id: collect
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_SOURCE_TOKEN }}
        run: python3 scripts/publish_dashboard.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Recheck main and publication order immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_dashboard.py --guard
      - name: Deploy public artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  report:
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'success' && needs.build.outputs.degraded == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report retained last-good data after successful publication
        run: |
          echo 'Published with explicit source warnings and retained last-good data. Check source access and the approved Wix status file.'
          exit 1
